[package]
name = "blitz-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/blitz-paint"
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["svg", "vello-cpu-filters"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "blitz-dom/svg"]
custom-widget = ["blitz-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in blitz-dom (off by default while the feature
# matures).
scrollbars = ["blitz-dom/scrollbars"]
# Rasterise a filtered subtree with the pinned Vello CPU backend, then apply the
# colour matrix to the composited pixels. It is a default so consumers do not
# silently get the older per-paint approximation; `default-features = false`
# users must opt in explicitly.
vello-cpu-filters = ["dep:anyrender_vello_cpu", "dep:vello_common", "dep:vello_cpu"]

[dependencies]
# Blitz dependencies
anyrender = { workspace = true }
anyrender_svg = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }
vello_common = { version = "0.1", optional = true }
vello_cpu = { version = "0.1", optional = true }
blitz-traits = { workspace = true }
blitz-dom = { workspace = true }

# Servo dependencies
style = { workspace = true }
euclid = { workspace = true }

# DioxusLabs dependencies
taffy = { workspace = true }

# Linebender + WGPU dependencies
parley = { workspace = true }
skrifa = { workspace = true }
color = { workspace = true }
peniko = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true, optional = true }

# Other dependencies
smallvec = { workspace = true }
tracing = { workspace = true, optional = true }
